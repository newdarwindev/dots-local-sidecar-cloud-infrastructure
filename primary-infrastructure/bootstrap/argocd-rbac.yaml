  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "primary-reconciler"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "argocd-application-controller",
      "namespace": "argocd"
    }
  ]
}
