global:
  tlsDisable: false
injector:
  enabled: false
csi:
  enabled: false
server:
  image:
    tag: 2.7.2
  authDelegator:
    enabled: false
  serviceAccount:
    create: true
    createSecret: false
    serviceDiscovery:
      enabled: false
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    apiAddr: https://openbao.openbao.svc:8200
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/tls/tls.crt"
          tls_key_file = "/openbao/tls/tls.key"
          tls_min_version = "tls12"
        }
        storage "raft" {
          path = "/openbao/data"
        }
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/ca.crt
  volumes:
    - name: tls
      secret:
        secretName: openbao-tls
  volumeMounts:
    - name: tls
      mountPath: /openbao/tls
      readOnly: true
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path
  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
ui:
  enabled: true
  serviceType: ClusterIP
