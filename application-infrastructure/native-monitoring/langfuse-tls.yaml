# Mount this configuration and the existing localhost leaf in the web pod.
# TLS terminates beside Langfuse; the final HTTP hop stays on pod loopback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-native-tls
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
      servers {
        protocols h1 h2
      }
    }
    https://:8443 {
      tls /tls/tls.crt /tls/tls.key {
        protocols tls1.3
      }
      header -Server
      reverse_proxy 127.0.0.1:3000
    }
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-native-tls
spec:
  type: ClusterIP
  selector:
    app: web
    app.kubernetes.io/name: langfuse
  ports:
    - {name: https, port: 8443, targetPort: 8443}
