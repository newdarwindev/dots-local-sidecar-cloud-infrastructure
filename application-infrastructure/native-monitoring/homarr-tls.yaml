apiVersion: v1
kind: ConfigMap
metadata:
  name: homarr-native-tls
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
      servers {
        protocols h1 h2
      }
    }
    https://:8444 {
      tls /tls/tls.crt /tls/tls.key {
        protocols tls1.3
      }
      header -Server
      reverse_proxy 127.0.0.1:7575
    }
---
apiVersion: v1
kind: Service
metadata:
  name: homarr-native-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: homarr-workload
    app.kubernetes.io/name: homarr
  ports:
    - {name: https, port: 8444, targetPort: 8444}
