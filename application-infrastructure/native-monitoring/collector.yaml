# Standard upstream Collector configuration; private inputs are existing Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-otel-config
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 65536
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key
              client_ca_file: /tls/ca.crt
              min_version: "1.3"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 64
      filter/privacy:
        error_mode: propagate
        traces:
          span:
            - 'Len(span.links) > 0'
          spanevent:
            - 'true'
      transform/privacy:
        error_mode: propagate
        trace_statements:
          - context: span
            statements:
              - 'keep_keys(resource.attributes, [])'
              - 'set(resource.attributes["service.name"], "codex-native")'
              - 'keep_keys(instrumentation_scope.attributes, [])'
              - 'set(instrumentation_scope.name, "codex.native.diagnostics")'
              - 'set(instrumentation_scope.version, "1")'
              - 'keep_keys(span.attributes, [])'
              - 'set(span.attributes["dots.accounting.role"], "diagnostic-noncanonical")'
              - 'set(span.attributes["langfuse.trace.name"], "Codex native diagnostics")'
              - 'set(span.attributes["langfuse.environment"], "local-codex")'
              - 'set(span.name, "codex.operation")'
              - 'set(span.status.message, "")'
              - 'set(span.trace_state, "")'
      batch:
        send_batch_size: 64
        send_batch_max_size: 128
        timeout: 2s
    exporters:
      otlphttp/langfuse:
        traces_endpoint: ${env:LANGFUSE_TRACES_ENDPOINT}
        headers:
          Authorization: ${env:LANGFUSE_DIAGNOSTIC_AUTHORIZATION}
          x-langfuse-ingestion-version: "4"
        tls:
          ca_file: /exporter-ca/ca.crt
          server_name_override: localhost
          min_version: "1.3"
        sending_queue:
          enabled: true
          queue_size: 256
          num_consumers: 2
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
          max_elapsed_time: 60s
    service:
      extensions: [health_check]
      telemetry:
        logs: {level: error}
        metrics: {level: none}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/privacy, transform/privacy, batch]
          exporters: [otlphttp/langfuse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-otel-collector
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: codex-otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: codex-otel-collector}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
          args: [--config=/conf/collector.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          env:
            - name: LANGFUSE_DIAGNOSTIC_AUTHORIZATION
              valueFrom:
                secretKeyRef: {name: collector-diagnostic-auth, key: authorization}
            - name: LANGFUSE_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: collector-private-endpoints, key: traces-endpoint}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: receiver-tls, mountPath: /tls, readOnly: true}
            - {name: exporter-ca, mountPath: /exporter-ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: codex-otel-config}
        - name: receiver-tls
          secret: {secretName: collector-receiver-tls}
        - name: exporter-ca
          configMap: {name: collector-exporter-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-otel-collector
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: codex-otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
