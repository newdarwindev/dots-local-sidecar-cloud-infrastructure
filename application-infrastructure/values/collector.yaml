# Trace-only diagnostic gateway. No real content, source enrollment, or logging
# pipeline. Exact Collector binary validation remains mandatory before activation.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.163.2"
  digest: "sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849"
command: {name: otelcol-contrib}
serviceAccount:
  create: true
  automountServiceAccountToken: false
clusterRole: {create: false}
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}
service: {type: ClusterIP}
ports:
  otlp: {enabled: false}
  otlp-http: {enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: false}
extraEnvs:
  - name: LANGFUSE_DIAGNOSTIC_AUTHORIZATION
    valueFrom:
      secretKeyRef: {name: collector-diagnostic-auth, key: authorization}
  - name: LANGFUSE_DIAGNOSTIC_TRACES_ENDPOINT
    valueFrom:
      configMapKeyRef: {name: collector-private-endpoints, key: traces-endpoint}
extraVolumes:
  - name: receiver-tls
    secret: {secretName: collector-receiver-tls}
  - name: exporter-ca
    configMap: {name: collector-exporter-ca}
extraVolumeMounts:
  - {name: receiver-tls, mountPath: /etc/otel/receiver-tls, readOnly: true}
  - {name: exporter-ca, mountPath: /etc/otel/exporter-ca, readOnly: true}
# alternateConfig replaces all upstream default receivers/exporters/pipelines,
# avoiding accidentally retaining the default debug exporter or log/metric path.
alternateConfig:
  extensions:
    health_check: {endpoint: "${env:MY_POD_IP}:13133"}
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "${env:MY_POD_IP}:4318"
          tls:
            cert_file: /etc/otel/receiver-tls/tls.crt
            key_file: /etc/otel/receiver-tls/tls.key
            client_ca_file: /etc/otel/receiver-tls/ca.crt
            min_version: "1.3"
  processors:
    memory_limiter: {check_interval: 1s, limit_mib: 384, spike_limit_mib: 64}
    filter/envelope:
      error_mode: propagate
      traces:
        span:
          - 'Len(span.events) > 0'
          - 'Len(span.links) > 0'
    transform/privacy:
      error_mode: propagate
      trace_statements:
        - context: span
          statements:
            - 'keep_keys(resource.attributes, [])'
            - 'keep_keys(instrumentation_scope.attributes, [])'
            - 'set(instrumentation_scope.name, "dots.synthetic.diagnostics")'
            - 'set(instrumentation_scope.version, "1")'
            - 'keep_keys(span.attributes, [])'
            - 'set(span.attributes["dots.accounting.role"], "diagnostic-noncanonical")'
            - 'set(span.name, "diagnostic.operation")'
            - 'set(span.status.message, "")'
            - 'set(span.trace_state, "")'
    batch: {send_batch_size: 64, send_batch_max_size: 128, timeout: 5s}
  exporters:
    otlphttp/diagnostics:
      traces_endpoint: "${env:LANGFUSE_DIAGNOSTIC_TRACES_ENDPOINT}"
      headers:
        Authorization: "${env:LANGFUSE_DIAGNOSTIC_AUTHORIZATION}"
        x-langfuse-ingestion-version: "4"
      tls:
        ca_file: /etc/otel/exporter-ca/ca.crt
        insecure: false
        insecure_skip_verify: false
        min_version: "1.3"
      sending_queue: {enabled: true, queue_size: 256, num_consumers: 2}
      retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s}
      timeout: 10s
  service:
    extensions: [health_check]
    telemetry:
      logs: {level: error}
      metrics: {level: none}
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/envelope, transform/privacy, batch]
        exporters: [otlphttp/diagnostics]
# Blocking privacy acceptance: gateway deliberately strips ALL arbitrary
# attributes and rejects span events/links rather than trusting names. Source
# adapter must emit an envelope with no schema URLs; Collector OTTL does not
# expose schema URLs through resource/scope paths. native_otlp.py now supplies
# an OFFLINE SYNTHETIC request-rebuilding prototype, not a connected source or
# validated production filter. Exact-binary isolated canaries confirm that direct
# input retains schema URLs; only the offline synthetic rebuilt envelope passed.
# Synthetic traffic only; this does not qualify connected or real sources. This file
# is not a claim of validated real-content filtering. Volatile bounded queue
# can lose diagnostics on outage/termination; no completeness guarantee.
