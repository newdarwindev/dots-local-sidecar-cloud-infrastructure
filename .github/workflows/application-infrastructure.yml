name: Staged application bundle validation
on:
  push:
    paths: ['application-infrastructure/**', 'primary-infrastructure/validation/install_helm.py', 'primary-infrastructure/artifacts.lock.json', '.github/workflows/application-infrastructure.yml']
  pull_request:
    paths: ['application-infrastructure/**', 'primary-infrastructure/validation/install_helm.py', 'primary-infrastructure/artifacts.lock.json', '.github/workflows/application-infrastructure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build validation container
        run: docker build --platform linux/amd64 -f application-infrastructure/validation/Dockerfile -t staged-app-validation .
      - name: Validate synthetic contracts and locked charts only
        run: docker run --rm --cpus=2 --memory=2g --cap-drop=ALL --security-opt=no-new-privileges staged-app-validation
