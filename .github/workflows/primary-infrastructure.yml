name: Primary infrastructure validation
on:
  push:
    paths: ['primary-infrastructure/**', 'validation/**', '.dockerignore', '.github/workflows/primary-infrastructure.yml']
  pull_request:
    paths: ['primary-infrastructure/**', 'validation/**', '.dockerignore', '.github/workflows/primary-infrastructure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Repository workflow remains disabled in GitHub. Editing is not enablement.
      - name: Lint full repository and validate primary contracts and schemas
        run: sh validation/run.sh primary
